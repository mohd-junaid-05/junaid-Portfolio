  <circle cx="510" cy="230" r="22" fill="#0a0a0a"/>
  <rect x="490" y="255" width="40" height="28" rx="2" fill="#0a0a0a"/>
  <!-- Figure 5 -->
  <circle cx="630" cy="230" r="22" fill="#0a0a0a"/>
  <rect x="610" cy="255" width="40" height="28" rx="2" fill="#0a0a0a"/>
  <!-- Presentation board (top) -->
  <rect x="250" y="40" width="300" height="160" rx="2" fill="#0a0a0a"/>
  <rect x="262" y="52" width="276" height="136" rx="1" fill="#ffffff"/>
  <!-- Presentation content (code lines on whiteboard) -->
  <rect x="275" y="68" width="100" height="8" rx="1" fill="#0a0a0a" opacity="0.8"/>
  <rect x="275" y="88" width="150" height="6" rx="1" fill="#0a0a0a" opacity="0.5"/>
  <rect x="290" y="104" width="120" height="6" rx="1" fill="#0a0a0a" opacity="0.5"/>
  <rect x="290" y="120" width="90" height="6" rx="1" fill="#0a0a0a" opacity="0.5"/>
  <rect x="275" y="136" width="80" height="6" rx="1" fill="#0a0a0a" opacity="0.8"/>
  <rect x="275" y="156" width="130" height="6" rx="1" fill="#0a0a0a" opacity="0.5"/>
  <rect x="290" y="172" width="95" height="6" rx="1" fill="#0a0a0a" opacity="0.5"/>
  <!-- Board legs -->
  <rect x="358" y="200" width="6" height="40" fill="#0a0a0a" opacity="0.7"/>
  <rect x="436" y="200" width="6" height="40" fill="#0a0a0a" opacity="0.7"/>
  <!-- Items on table (laptops, books — simplified) -->
  <rect x="145" y="262" width="40" height="18" rx="1" fill="#0a0a0a" opacity="0.4"/>
  <rect x="265" y="262" width="40" height="18" rx="1" fill="#0a0a0a" opacity="0.4"/>
  <rect x="375" y="262" width="50" height="18" rx="1" fill="#0a0a0a" opacity="0.4"/>
  <rect x="485" y="262" width="40" height="18" rx="1" fill="#0a0a0a" opacity="0.4"/>
  <rect x="605" y="262" width="40" height="18" rx="1" fill="#0a0a0a" opacity="0.4"/>
  <!-- Bottom floor line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#0a0a0a" stroke-width="2"/>
