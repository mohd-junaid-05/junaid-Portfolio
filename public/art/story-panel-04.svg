<!-- Original illustration: Workshops — night terminal / learning motif (manga ink) -->
<!-- Created for Mohd Junaid portfolio, Phase 08. No reference artwork used. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Abstract figures in workshop arrangement (top-down silhouettes) -->
  <!-- Table (horizontal bar center) -->
  <rect x="100" y="280" width="600" height="16" rx="2" fill="#0a0a0a"/>
  <!-- Figures seated (simple geometric people) -->
  <!-- Figure 1 (left) -->
  <circle cx="170" cy="230" r="22" fill="#0a0a0a"/>
  <rect x="150" y="255" width="40" height="28" rx="2" fill="#0a0a0a"/>
  <!-- Figure 2 -->
  <circle cx="290" cy="230" r="22" fill="#0a0a0a"/>
  <rect x="270" y="255" width="40" height="28" rx="2" fill="#0a0a0a"/>
  <!-- Figure 3 -->
  <circle cx="400" cy="230" r="22" fill="#0a0a0a"/>
  <rect x="380" y="255" width="40" height="28" rx="2" fill="#0a0a0a"/>
