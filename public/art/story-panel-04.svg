  <line x1="400" y1="200" x2="50" y2="430" stroke="#0a0a0a" stroke-width="0.5" opacity="0.06"/>
  <line x1="400" y1="200" x2="200" y2="450" stroke="#0a0a0a" stroke-width="0.5" opacity="0.06"/>
  <line x1="400" y1="200" x2="600" y2="450" stroke="#0a0a0a" stroke-width="0.5" opacity="0.06"/>
  <line x1="400" y1="200" x2="750" y2="430" stroke="#0a0a0a" stroke-width="0.5" opacity="0.06"/>
  <!-- Halftone background bottom-right -->
  <circle cx="650" cy="440" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="680" cy="440" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="710" cy="440" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="740" cy="440" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="770" cy="440" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="650" cy="468" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="680" cy="468" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="710" cy="468" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="740" cy="468" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="770" cy="468" r="3" fill="#0a0a0a" opacity="0.1"/>
  <!-- Dots left column -->
  <circle cx="30" cy="420" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="60" cy="420" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="30" cy="448" r="3" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="60" cy="448" r="3" fill="#0a0a0a" opacity="0.1"/>
  <!-- Panel frame -->
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="#0a0a0a" stroke-width="3"/>
