<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 800"
  width="1200"
  height="800"
  fill="none"
>
  <rect width="1200" height="800" fill="#0a0a0a" />

  <!-- Subtle sky gradient bands & dramatic manga clouds -->
  <path
    d="M0 190 Q240 130 520 185 T1200 150 L1200 440 L0 440 Z"
    fill="#1c1b18"
  />
  <path
    d="M120 260 Q360 190 640 245 T1200 220 L1200 440 L120 440 Z"
    fill="#2e2c27"
    opacity="0.7"
  />
  <!-- Horizon glow -->
  <ellipse cx="780" cy="400" rx="340" ry="95" fill="#ece7dc" opacity="0.22" />
  <ellipse cx="780" cy="405" rx="190" ry="52" fill="#ece7dc" opacity="0.35" />

  <!-- Distant mountain / cloud ridge -->
  <path
    d="M0 430 L180 390 L340 415 L540 375 L730 405 L930 365 L1100 395 L1200 380 L1200 460 L0 460 Z"
    fill="#141311"
  />

  <!-- Cityscape skyline silhouettes -->
  <g fill="#0a0a0a" stroke="#ece7dc" stroke-opacity="0.18" stroke-width="1.5">
    <rect x="30" y="420" width="85" height="380" />
    <rect x="130" y="370" width="70" height="430" />
    <rect x="215" y="450" width="95" height="350" />
    <rect x="330" y="340" width="90" height="460" />
    <rect x="435" y="410" width="75" height="390" />
    <rect x="525" y="310" width="105" height="490" />
    <rect x="645" y="390" width="80" height="410" />
    <rect x="740" y="355" width="95" height="445" />
    <rect x="850" y="290" width="110" height="510" />
    <rect x="975" y="380" width="85" height="420" />
    <rect x="1075" y="330" width="105" height="470" />
  </g>

  <!-- Lit window clusters -->
  <g fill="#ece7dc" opacity="0.28">
    <rect x="350" y="365" width="12" height="16" />
    <rect x="372" y="365" width="12" height="16" />
    <rect x="350" y="395" width="12" height="16" />
    <rect x="545" y="335" width="14" height="18" />
    <rect x="570" y="335" width="14" height="18" />
    <rect x="595" y="335" width="14" height="18" />
    <rect x="545" y="368" width="14" height="18" />
    <rect x="595" y="368" width="14" height="18" />
    <rect x="875" y="320" width="14" height="20" />
    <rect x="900" y="320" width="14" height="20" />
    <rect x="925" y="320" width="14" height="20" />
    <rect x="875" y="355" width="14" height="20" />
    <rect x="925" y="355" width="14" height="20" />
    <rect x="1095" y="360" width="14" height="18" />
    <rect x="1120" y="360" width="14" height="18" />
  </g>

  <!-- Foreground rooftop rail & standing silhouette -->
  <path
    d="M360 720 L520 520 L585 495 L635 530 L615 720 Z"
    fill="#0a0a0a"
    stroke="#ece7dc"
    stroke-opacity="0.32"
    stroke-width="2"
  />
  <circle cx="565" cy="435" r="34" fill="#0a0a0a" stroke="#ece7dc" stroke-opacity="0.45" stroke-width="2" />
  <path
    d="M520 490 C440 505, 365 555, 305 605 L445 600 L520 545 Z"
    fill="#0a0a0a"
    stroke="#ece7dc"
    stroke-opacity="0.28"
    stroke-width="1.5"
  />

  <!-- Diagonal speed/rain streaks -->
  <g stroke="#ece7dc" stroke-opacity="0.14" stroke-width="1.5">
    <line x1="880" y1="60" x2="720" y2="220" />
    <line x1="940" y1="90" x2="790" y2="240" />
    <line x1="1030" y1="45" x2="870" y2="205" />
    <line x1="1120" y1="110" x2="980" y2="250" />
  </g>
</svg>
