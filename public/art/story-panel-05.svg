<!-- Original illustration: Build & Share — abstract launch/burst motif (manga ink speedlines) -->
<!-- Created for Mohd Junaid portfolio, Phase 08. No reference artwork used. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0a0a0a"/>
  <!-- Burst / conic speedlines from center-right -->
  <line x1="600" y1="300" x2="0" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="80" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="160" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="240" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="320" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="400" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="0" y2="80" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="0" y2="160" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="0" y2="240" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="0" y2="320" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="0" y2="400" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="0" y2="480" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="0" y2="560" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="80" y2="600" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="200" y2="600" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="320" y2="600" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="300" x2="440" y2="600" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <!-- Brighter burst lines (closer to center) -->
  <line x1="600" y1="300" x2="0" y2="200" stroke="#ffffff" stroke-width="2.5" opacity="0.2"/>
  <line x1="600" y1="300" x2="0" y2="300" stroke="#ffffff" stroke-width="2.5" opacity="0.25"/>
  <line x1="600" y1="300" x2="0" y2="400" stroke="#ffffff" stroke-width="2.5" opacity="0.2"/>
  <line x1="600" y1="300" x2="200" y2="0" stroke="#ffffff" stroke-width="2.5" opacity="0.2"/>
  <line x1="600" y1="300" x2="200" y2="600" stroke="#ffffff" stroke-width="2.5" opacity="0.2"/>
  <!-- Central starburst/arrow shape -->
  <polygon points="600,260 640,300 600,340 560,300" fill="#ffffff" opacity="0.9"/>
  <polygon points="560,300 580,290 580,310" fill="#ffffff" opacity="0.6"/>
  <!-- Concentric glow rings around center -->
  <circle cx="600" cy="300" r="18" fill="#ffffff" opacity="0.5"/>
  <circle cx="600" cy="300" r="35" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <circle cx="600" cy="300" r="55" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
  <circle cx="600" cy="300" r="80" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
  <!-- Star-tick marks (impact) -->
  <line x1="600" y1="220" x2="600" y2="235" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <line x1="600" y1="365" x2="600" y2="380" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <line x1="520" y1="300" x2="535" y2="300" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <line x1="665" y1="300" x2="680" y2="300" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <!-- Halftone dots (top left) -->
  <circle cx="50" cy="40" r="3" fill="#ffffff" opacity="0.15"/>
  <circle cx="90" cy="40" r="3" fill="#ffffff" opacity="0.15"/>
  <circle cx="130" cy="40" r="3" fill="#ffffff" opacity="0.15"/>
  <circle cx="50" cy="75" r="3" fill="#ffffff" opacity="0.15"/>
  <circle cx="90" cy="75" r="3" fill="#ffffff" opacity="0.15"/>
  <circle cx="130" cy="75" r="3" fill="#ffffff" opacity="0.15"/>
  <circle cx="50" cy="110" r="3" fill="#ffffff" opacity="0.12"/>
  <circle cx="90" cy="110" r="3" fill="#ffffff" opacity="0.12"/>
  <!-- Abstract GitHub graph (contribution grid hint) -->
  <rect x="60" y="430" width="10" height="10" rx="1" fill="#ffffff" opacity="0.2"/>
  <rect x="76" y="430" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
  <rect x="92" y="430" width="10" height="10" rx="1" fill="#ffffff" opacity="0.15"/>
  <rect x="108" y="430" width="10" height="10" rx="1" fill="#ffffff" opacity="0.6"/>
  <rect x="124" y="430" width="10" height="10" rx="1" fill="#ffffff" opacity="0.3"/>
  <rect x="60" y="446" width="10" height="10" rx="1" fill="#ffffff" opacity="0.5"/>
  <rect x="76" y="446" width="10" height="10" rx="1" fill="#ffffff" opacity="0.2"/>
  <rect x="92" y="446" width="10" height="10" rx="1" fill="#ffffff" opacity="0.7"/>
  <rect x="108" y="446" width="10" height="10" rx="1" fill="#ffffff" opacity="0.2"/>
  <rect x="124" y="446" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
  <rect x="60" y="462" width="10" height="10" rx="1" fill="#ffffff" opacity="0.3"/>
  <rect x="76" y="462" width="10" height="10" rx="1" fill="#ffffff" opacity="0.6"/>
  <rect x="92" y="462" width="10" height="10" rx="1" fill="#ffffff" opacity="0.2"/>
  <rect x="108" y="462" width="10" height="10" rx="1" fill="#ffffff" opacity="0.5"/>
  <rect x="124" y="462" width="10" height="10" rx="1" fill="#ffffff" opacity="0.3"/>
</svg>
